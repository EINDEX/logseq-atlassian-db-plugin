name: Publish Logseq plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PLUGIN_NAME: logseq-atlassian-linker
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run check

      - name: Extract release notes
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: Build release zip
        run: |
          mkdir -p "release/${PLUGIN_NAME}"
          cp -R README.md CHANGELOG.md LICENSE package.json icon.png dist "release/${PLUGIN_NAME}/"
          cd release
          zip -r "${PLUGIN_NAME}.zip" "${PLUGIN_NAME}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            release/${{ env.PLUGIN_NAME }}.zip
            package.json
